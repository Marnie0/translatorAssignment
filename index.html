<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translator</title>
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main
      class="main container-fluid bg-dark min-vh-100 row justify-content-center align-items-center mx-0"
    >
      <div class="col-12 col-sm-9 col-md-7 col-lg-5">
        <section
          class="translatorSection bg-light d-flex flex-column justify-content-center align-items-center p-3 p-md-5 rounded"
        >
          <h1 class="pb-2">Welcome to the Translator</h1>
          <form class="form w-100">
            <section class="textAreaSection d-flex flex-column flex-md-row pb-2 gap-4">
              <textarea
                class="form-control toTranslate fs-5"
                placeholder="Enter text to translate"
              ></textarea>
              <textarea
                class="form-control translated text-light fs-5 bg-secondary"
                placeholder="Translated text will appear here"
                disabled
              ></textarea>
            </section>
            <section
              class="selectSection d-flex flex-column flex-md-row justify-content-center gap-2 p-3"
            >
              <select
                class="form-select fromLanguage"
                aria-label="Default select example"
              >
                <option value="" selected disabled>Choose Language</option>
              </select>
              <button class="swapBtn btn btn-dark" type="button">Swap</button>
              <select
                class="form-select toLanguage"
                aria-label="Default select example"
              >
                <option value="" selected disabled>Choose Language</option>
              </select>
            </section>
            <section class="btnSection d-flex justify-content-center gap-2 p-3">
              <button
                class="translateBtn btn btn-primary rounded"
                type="submit"
              >
                Translate
              </button>
            </section>
          </form>
        </section>
      </div>
    </main>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
